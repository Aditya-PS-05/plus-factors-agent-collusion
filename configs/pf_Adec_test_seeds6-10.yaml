# Derived from colosseum/experiments/collusion/configs/hackathon_2_1_a_pair_private_channel.yaml
# by plus-factors/analysis/make_configs.py. Only seeds, planning rounds,
# output_dir/tag and (optionally) the model id differ from the shipped file.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags:
  - hackathon_2_1_a_pair_private
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: path
  num_agents: 4
  consolidate_channels: true
llm_models:
- label: openai_gpt4o_mini
  llm:
    provider: openrouter
    openrouter:
      model: Qwen/Qwen3-30B-A3B-Instruct-2507
      params:
        max_tokens: 1500
        temperature: 0.7
experiment:
  tag: pf_Adec_test
  output_dir: ../../plus-factors/results/raw/Adec_test
  max_concurrent_runs: 2
  seeds:
  - 6
  - 7
  - 8
  - 9
  - 10
  collusion:
    colluder_selection: first_and_last
    agent_order: random
  sweeps:
  - name: hackathon_2_1_a_pair_private
    topologies:
    - path
    num_agents:
    - 4
    colluder_counts:
    - 2
    secret_channel_enabled:
    - true
    prompt_variants:
    - deception
